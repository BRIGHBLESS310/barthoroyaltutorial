
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutorial</title>
    <link rel="stylesheet"
          href="https://www.w3schools.com/w3css/6/w3.css">
</head>
<body>

    <div class="w3-container w3-green w3-center w3-padding-32">
        <h1>Welcome to the Next Step!</h1>
        <p>Enjoy your journey into the world of AI!</p>
    </div>

    <div class="w3-container w3-center w3-padding-32">
        <h2>Rate Us</h2>
        <p>How would you rate your AI learning experience?</p>

        <div id="stars" style="font-size: 40px;">
            <button class="star" data-rating="1">☆</button>
            <button class="star" data-rating="2">☆</button>
            <button class="star" data-rating="3">☆</button>
            <button class="star" data-rating="4">☆</button>
            <button class="star" data-rating="5">☆</button>
        </div>

        <p id="message">Select a rating from 1 to 5 stars.</p>

        <button id="submitRating"
                class="w3-button w3-green w3-round"
                disabled>
            Submit Rating
        </button>
    </div>

    <script>
        let selectedRating = 0;

        const stars = document.querySelectorAll(".star");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitRating");

        stars.forEach(function(star) {
            star.style.border = "none";
            star.style.background = "none";
            star.style.cursor = "pointer";
            star.style.color = "orange";

            star.addEventListener("click", function() {
                selectedRating = Number(star.dataset.rating);

                stars.forEach(function(item) {
                    item.textContent =
                        Number(item.dataset.rating) <= selectedRating
                        ? "★" : "☆";
                });

                message.textContent =
                    "You selected " + selectedRating + " out of 5 stars.";

                submitButton.disabled = false;
            });
        });

        submitButton.addEventListener("click", function() {
            message.textContent =
                "Thank you for rating our AI tutorial " +
                selectedRating + " out of 5 stars!";
            submitButton.disabled = true;
        });
    </script>
<button><a href="moveon.html" class="w3-button w3-black">another step</a></button>
</body>
</html>
